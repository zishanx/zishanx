<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="600"
     viewBox="0 0 1200 600">

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

text{
font-family:'JetBrains Mono',monospace;
dominant-baseline:middle;
}

.bg{
fill:#0d1117;
}

.window{
fill:#161b22;
stroke:#30363d;
stroke-width:2;
}

.title{
fill:#8b949e;
font-size:18px;
}

.white{
fill:#f0f6fc;
font-size:24px;
}

.green{
fill:#3fb950;
font-size:24px;
}

.gray{
fill:#8b949e;
font-size:22px;
}

.small{
fill:#8b949e;
font-size:18px;
}

.cursor{
animation:blink 1s steps(1) infinite;
}

.l1{opacity:0;animation:show .01s forwards .6s;}
.l2{opacity:0;animation:show .01s forwards 1.2s;}
.l3{opacity:0;animation:show .01s forwards 1.8s;}
.l4{opacity:0;animation:show .01s forwards 2.4s;}
.l5{opacity:0;animation:show .01s forwards 3.0s;}
.l6{opacity:0;animation:show .01s forwards 3.6s;}
.l7{opacity:0;animation:show .01s forwards 4.2s;}
.l8{opacity:0;animation:show .01s forwards 4.8s;}
.l9{opacity:0;animation:show .01s forwards 5.4s;}
.l10{opacity:0;animation:show .01s forwards 6s;}
.l11{opacity:0;animation:show .01s forwards 6.6s;}
.l12{opacity:0;animation:show .01s forwards 7.2s;}

.bar{
fill:#3fb950;
stroke:#3fb950;
stroke-width:0;
transform-origin:left;
transform:scaleX(0);
animation:load 2s forwards 1.4s;
}

@keyframes load{
to{
transform:scaleX(1);
}
}

@keyframes show{
to{
opacity:1;
}
}

@keyframes blink{
50%{
opacity:0;
}
}
</style>

